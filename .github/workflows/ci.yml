name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docuchat
          POSTGRES_PASSWORD: docuchat
          POSTGRES_DB: docuchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U docuchat -d docuchat_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Drives the conftest's db_session fixture onto Postgres so the
      # vector_store tests actually run instead of skipping.
      TEST_DATABASE_URL: postgresql+asyncpg://docuchat:docuchat@localhost:5432/docuchat_test
      # The config validator refuses prod boot with the placeholder JWT secret.
      JWT_SECRET_KEY: ci-only-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app/ tests/

      - name: Run tests
        run: pytest tests/ -v

  frontend-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
